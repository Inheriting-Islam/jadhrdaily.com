name = "jadhr-subscribe"
main = "subscribe.js"
compatibility_date = "2026-08-14"

# Same origin as the site, so the page makes no cross-host request.
# Requires the jadhrdaily.com record to be proxied (orange cloud) — do this only
# after GitHub has issued the Pages certificate, or the challenge fails.
routes = [
  { pattern = "jadhrdaily.com/api/*", zone_name = "jadhrdaily.com" }
]

# LIST holds the subscribers ({email, at, source} per key, keyed sub:<email>).
# RATE holds only hashed-IP rate-limit keys with a 60-second TTL.
# Create each with: npx wrangler kv namespace create <BINDING>
# [[kv_namespaces]]
# binding = "LIST"
# id = "<paste the id wrangler prints>"
# [[kv_namespaces]]
# binding = "RATE"
# id = "<paste the id wrangler prints>"

# The export credential is a secret, never a var:
#   npx wrangler secret put EXPORT_KEY     # any long random string
